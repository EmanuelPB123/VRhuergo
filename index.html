<html>

<head>
  <title>VR Chalet Huergo Official</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/environment.js"></script>
  <script src="js/light.js"></script>
  <script src="js/linterna.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="movement-controls"></div>

  <!-- Audio elements for collision sounds -->
  <audio id="collision-sound-1" src="https://cdn.freesound.org/previews/417/417089_5121236-lq.mp3"></audio>
  <audio id="collision-sound-2" src="https://cdn.freesound.org/previews/448/448084_6142149-lq.mp3"></audio>
  <audio id="collision-sound-3" src="https://cdn.freesound.org/previews/411/411642_5121236-lq.mp3"></audio>


  <a-scene>

    <a-assets>
      <audio id="ambient-sound" src="sound/bosque-66633.mp3"></a-sound>
    </a-assets>
    <!-- Sonido de ambiente de fondo (por ejemplo, un zumbido eléctrico suave) -->



    <!-- Cielo -->
    <a-sky color="#000000"></a-sky>
    <!-- <a-plane position="0 0 0" rotation="-90 0 0" width="2.5" height="2.4" material="color: #7BC8A4; roughness: 0.8; metalness: 0.2"></a-plane> -->


    <!-- Restricted zone markers -->

    <!-- der --><a-box position="0.38 1.57 -0.99" width="0.002" height="0.02" depth="0.74"

    <!-- atras --><a-box position="0.04 1.57 -0.62" width="0.68" height="0.02" depth="0.002"

    <!-- adelante --><a-box position="0.04 1.57 -1.36" width="0.68" height="0.02" depth="0.002"
      material="color: #ff5500; opacity: 0.5; roughness: 0.7; metalness: 0.3"></a-box>

    <!-- Outer boundary walls -->
    <!-- adelante --><a-box position="0 1.57 -2.1" width="4.18" height="0.5" depth="0.01"

    <!-- izq --><a-box position="-2.1 1.57 -0.45" width="0.01" height="0.5" depth="3.36"
      material="color: #ff5500; opacity: 0.9; roughness: 0.1; metalness: 0.1"></a-box>
    <!-- der --><a-box position="2 1.57 -0.45" width="0.01" height="0.5" depth="3.36"
      material="color: #ff5500; opacity: 0.9; roughness: 0.1; metalness: 0.1"></a-box>

    <!-- edificio -->
    <a-entity position="-0.44 1.57 0" scale="0.04 0.04 0.04" gltf-model="untitled.glb"
      shadow="cast: true; receive: false">
    </a-entity>
    <!-- sound -->
    <a-entity id="ambient-sound" position="0.1 1.55 -0"
      sound="src: #ambient-sound; autoplay:true; loop: true; volume: 0.1; maxDistance: 10; refDistance: 1; rolloffFactor: 1">
    </a-entity>




    <a-text value="Bienvenido al Chalet Huergo" position="-0.08 1.7 -0.08" color="#ffffff"
      scale="0.06 0.06 0.06"></a-text>
    <a-text value="SALIDA" position="0.02 1.7 -0.08" color="#ffffff" scale="0.06 0.06 0.06" rotation="0 180"></a-text>
    <a-text value="Restricted Area" position="0.19 1.63 -0.62" color="#FF0000" scale="0.02 0.02 0.02"></a-text>

    <a-entity position="0 0.032 0">
      <a-camera look-controls>
        <!-- linterna -->
        <!-- Cámara con linterna adjunta -->
        <a-entity id="flashlight" light="type: spot; 
        color: #fff; 
        intensity: 0.75; 
        angle: 45; 
        penumbra: 0.2; 
        decay: 1;
        distance: 0.4;
        castShadow: true;
        shadowMapWidth: 1024;
        shadowMapHeight: 1024" position="0 0 0" rotation="0 0 0">
        </a-entity>

        <!-- Modelo visual de la linterna (opcional) -->
        <a-entity position="0.004 -0.006 -0.004" rotation="0 -20 0">
          <a-cylinder color="#333" height="0.002" radius="0.0004" position="0 0 0"></a-cylinder>
          <a-cylinder color="#555" height="0.0004" radius="0.0006" position="0 -0.0012 0"></a-cylinder>
        </a-entity>
      </a-camera>
    </a-entity>

    <!-- luces -->
    <!-- <a-light type="ambient" color="#fff5ab" intensity="0.1"></a-light> -->
    <!-- <a-light type="directional" color="#fff5ab" intensity="0.1" position="0.02 0.02 0.02"></a-light> -->

      <a-entity light-helper="type: spot"></a-entity>
    </a-light> -->

    <!-- Luz interior -->

    <a-light type="spot" color="#ffdb9d" intensity="0.7" position="0.3 1.63 -0.63" angle="360" penumbra="0.3"
      distance="1" decay="1" cast-shadow="true"
      shadow="mapSize: 1024; bias: -0.0001; camera-near: 0.01; camera-far: 0.2">
      <a-sphere radius="0.0025" color="#ffdb9d" material="emissive: #fff6dd; emissiveIntensity: 1.5"></a-sphere>
    </a-light>

    <a-light type="spot" color="#ffdb9d" intensity="0.7" position="0.12 1.63 -0.63" angle="360" penumbra="0.3"
      distance="1" decay="1" cast-shadow="true"
      shadow="mapSize: 1024; bias: -0.0001; camera-near: 0.01; camera-far: 0.2">
      <a-sphere radius="0.0025" color="#ffdb9d" material="emissive: #fff6dd; emissiveIntensity: 1.5"></a-sphere>
    </a-light>

    <a-light type="spot" color="#ffdb9d" intensity="0.7" position="-0.07 1.665 -0.8" angle="360" penumbra="0.3"
      distance="1" decay="1" cast-shadow="true"
      shadow="mapSize: 1024; bias: -0.0001; camera-near: 0.01; camera-far: 0.2">
      <a-sphere radius="0.0025" color="#ffdb9d" material="emissive: #fff6dd; emissiveIntensity: 1.5"></a-sphere>
    </a-light>

    <!-- Luz exterior -->

    <a-light type="spot" color="#ffdb9d" intensity="0.7" position="0.1 1.55 -0" angle="360" penumbra="0.3" distance="1"
      decay="1" cast-shadow="true" shadow="mapSize: 1024; bias: -0.0001; camera-near: 0.01; camera-far: 0.2">
      <a-sphere radius="0.0025" color="#ffdb9d" material="emissive: #fff6dd; emissiveIntensity: 1.5"></a-sphere>
      <a-entity
        sound="src: url(sound/sound/forest-ambience-296528.mp3); autoplay: true; loop: true; volume: 0.5; rolloffFactor: 3; maxDistance: 5; refDistance: 1;"></a-entity>
    </a-light>

    <a-light type="spot" color="#ffdb9d" intensity="0.7" position="-0.1 1.555 -0" angle="360" penumbra="0.3"
      distance="1" decay="1" cast-shadow="true"
      shadow="mapSize: 1024; bias: -0.0001; camera-near: 0.01; camera-far: 0.2">
      <a-sphere radius="0.0025" color="#ffdb9d" material="emissive: #fff6dd; emissiveIntensity: 1.5"></a-sphere>

    <a-light type="spot" color="#ffdb9d" intensity="0.7" position="0.041 1.665 -1.33" angle="360" penumbra="0.3"

      shadow="mapSize: 1024; bias: -0.0001; camera-near: 0.01; camera-far: 0.2">
      <a-sphere radius="0.0025" color="#ffdb9d" material="emissive: #fff6dd; emissiveIntensity: 1.5"></a-sphere>
    </a-light>



  </a-scene>

</html>
